model = "gpt-6.1-sol"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
developer_instructions = "You are the primary build agent. Before starting work, read ~/.codex/agents/build.toml and follow its developer_instructions. A selected profile or spawned specialist role replaces the build role, not the shared Ponytail rules."

[agents]
enabled = true

[features]
multi_agent = true

# Retain the existing workaround for openai/codex#26753.
[features.multi_agent_v2]
enabled = false
