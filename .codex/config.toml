model = "gpt-6.1-sol"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
developer_instructions = "You are the primary build agent. Before starting work, read ~/.codex/AGENTS.md and ~/.codex/roles/build.md. A selected profile or spawned specialist role replaces build."

[agents]
enabled = true

[features]
multi_agent = true

# Retain the existing workaround for openai/codex#26753.
[features.multi_agent_v2]
enabled = false

[projects."/home/user/.dotfiles"]
trust_level = "trusted"

[projects."/home/user/Documents/gitlab/go/DurpDeploy"]
trust_level = "trusted"

[projects."/home/user/Documents/gitlab/go/durpdeploy-agent"]
trust_level = "trusted"

[tui]
screen_reader_detection_done = true

[tui.model_availability_nux]
"gpt-6.1-sol" = 2
