- name: Upgrade Packages
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: yes
  become: yes
  when: required_packages_dnf is defined

- name: Install Packages
  ansible.builtin.dnf:
    state: present
    update_cache: yes
    name: "{{ (required_packages_dnf | default([]) + required_packages_dnf_extra | default([])) | union([]) }}"
  become: yes
  when: required_packages_dnf is defined
