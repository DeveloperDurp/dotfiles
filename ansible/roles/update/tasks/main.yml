- name: Load host-specific package vars
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ role_path }}/../packages/vars/{{ ansible_facts['hostname'] }}.yml"
      skip: true

- name: Update packages
  ansible.builtin.include_tasks: "{{ role_path }}/../../scripts/update_packages.yml"
