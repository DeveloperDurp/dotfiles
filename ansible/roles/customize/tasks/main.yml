- name: Load a variable file
  include_vars: "{{ item }}"
  with_first_found:
  - "vars/{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_version'] }}.yml"
  - "vars/{{ ansible_facts['distribution'] }}.yml"
  - "vars/{{ ansible_facts['os_family'] }}.yml"
  - "vars/defaults.yml"

- name: Load host-specific vars
  include_vars: "{{ item }}"
  with_first_found:
  - files:
    - "vars/{{ ansible_facts['hostname'] }}.yml"
    skip: true

- name:
  include_tasks: "defaults.yml"

