# citadel (desktop) vars. Loaded after the distro vars, so any same-named key
# here overrides it. `*_extra` lists are appended by the install scripts.
---
install_homebrew_if_missing: true

required_packages_brew_extra:
  - zsh-autosuggestions
  - zsh-history-substring-search
  - oh-my-posh
  - vivid
  - lazygit
  - glab
  - kubectl
  - yazi
  - powershell
  - minio
  - minikube
  - vault-cli
  - bitwarden-cli
  - argocd
  - talosctl
  - codex
  - gh
  - bun

required_packages_dnf_extra:
  - stow
  - zsh
  - kitty

  # core tools
  - neovim
  - tmux
  - fzf
  - zoxide
  - eza
  - bat
  - wget
  - curl
  - nmap
  - podman
  - podman-compose
  - helm
  - ripgrep
  - yq
  - jq
  - k9s
  - htop
  - gimp
  - dnsutils
  - openssh
  - rclone
  - opentofu
  - wofi
  - libsecret
  - zenity
  - libnotify
  - wl-clipboard
  - golangci-lint
  - fastfetch
  - timeshift
  - sqlite
  - btop
  - yubikey-manager
  - hugo

  # development
  - golang
  - nodejs
  - npm
  - python3
  - python3-pip
  - git
  - podman

  # system
  - '@virtualization'
  - cockpit
  - dnf5-plugin-automatic

  # Gaming
  - steam

flatpak_remote_extra:
  - {
      name: "flathub",
      url: "https://dl.flathub.org/repo/flathub.flatpakrepo",
      method: "system",
    }

required_packages_flatpak_extra:
  - me.proton.Mail
  - com.protonvpn.www
  - com.github.tchx84.Flatseal
  - com.vscodium.codium
  - org.chromium.Chromium
  - org.videolan.VLC
  - fr.handbrake.ghb
  - org.signal.Signal
  - com.yubico.yubioath
  - com.discordapp.Discord
  - com.makemkv.MakeMKV

