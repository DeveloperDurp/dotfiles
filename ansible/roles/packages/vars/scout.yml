# scout (laptop) vars. Loaded after the distro vars, so any same-named key
# here overrides it. `*_extra` lists are appended by the install scripts.
---
install_homebrew_if_missing: true

# scout currently runs nix; the migration is to brew, so skip nix installs.
skip_nix: true
required_packages_brew_extra:
  # moved off nix -> brew (not in the Pop!_OS 24.04 apt archive)
  - golangci-lint
  - opentofu
  - k9s
  - fastfetch
  - yq              # Go version (apt's yq is the Python clone)
  - awscli          # was nix `aws`
  - ast-grep
  - ripgrep
  - devpod
  # platform tools
  - zsh-autosuggestions
  - zsh-history-substring-search
  - oh-my-posh
  - vivid
  - lazygit
  - glab
  - kubectl
  - yazi
  - powershell
  - minio
  - minikube
  - vault-cli
  - bitwarden-cli
  - argocd
  - talosctl
  - codex
  - gh
  - bun
  - bat
  - neovim
  - kitty
  - fzf
  - zoxide
  - eza

required_packages_apt_extra:
  - stow
  - zsh

  # core tools
  - tmux
  - wget
  - curl
  - nmap
  - podman
  - podman-compose
  - jq
  - htop
  - gimp
  - dnsutils
  - openssh-client
  - rclone
  - wofi
  - libsecret-1-0
  - libsecret-tools
  - zenity
  - libnotify-bin
  - wl-clipboard
  - btop
  - yubikey-manager
  - hugo
  - timeshift
  - sqlite3

  # development
  - golang
  - nodejs
  - npm
  - python3
  - python3-pip
  - git

  # system: the Pop!_OS-24.04 base vars already install qemu-kvm,
  # libvirt-daemon, virt-manager etc., so no @virtualization group here.

  # Gaming
  - steam

flatpak_remote_extra:
  - {
      name: "flathub",
      url: "https://dl.flathub.org/repo/flathub.flatpakrepo",
      method: "system",
    }

required_packages_flatpak_extra:
  - com.makemkv.MakeMKV
  # on scout but was missing from the declared config
  - app.zen_browser.zen
  - com.nextcloud.desktopclient.nextcloud
  - dev.zed.Zed
  - rocks.shy.VacuumTube

